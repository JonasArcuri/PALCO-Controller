<title>Palco — Controladora de samples</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101115;color:#f4f4f7}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #363841;background:#25272f;color:inherit;border-radius:9px;padding:10px 14px}button:hover{background:#343641}button:disabled{opacity:.4;cursor:default}button.primary{background:#c4f46c;color:#142109;border:0;font-weight:700}button.danger{color:#ff9d9d}input{background:#14151a;border:1px solid #383b46;color:inherit;border-radius:8px;padding:10px;width:100%}input[type=range]{padding:0;accent-color:#c4f46c}label{display:block;font-size:13px;color:#a7aab6;margin:12px 0}label input{margin-top:6px}header{height:82px;border-bottom:1px solid #292b34;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.brand{font-size:25px;font-weight:850;letter-spacing:3px}.brand span{color:#c4f46c}.badge{font-size:12px;color:#a7bb8b;border:1px solid #39432b;border-radius:20px;padding:7px 12px}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 82px)}aside{border-right:1px solid #292b34;padding:24px 18px;display:flex;flex-direction:column;gap:18px}h1{font-size:36px;letter-spacing:-1px;margin:8px 0}h2{font-size:15px;margin:0}p{color:#a2a5b0;line-height:1.6}.eyebrow{font-size:11px;letter-spacing:2px;color:#a7abbb;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.songs{display:grid;gap:8px}.song{text-align:left;background:transparent;border:1px solid transparent;overflow-wrap:anywhere}.song.active{background:#252d1e;border-color:#536f32;color:#d1f99a}.song small{display:block;color:#9b9eab;margin-top:5px}.footnote{font-size:12px;margin-top:auto}.main{padding:36px;min-width:0}.toolbar{margin:26px 0;padding:18px;background:#191b21;border:1px solid #2c2e37;border-radius:12px}.master{display:flex;gap:12px;align-items:center;margin:0}.master input{width:130px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:18px}.card{background:#1b1d24;border:1px solid #343640;border-radius:15px;padding:20px;min-width:0}.card.playing{border-color:#b7e76a;box-shadow:0 0 0 1px #b7e76a30}.card h3{margin:14px 0 4px;overflow-wrap:anywhere}.filename{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9296a4}.type{font-size:10px;letter-spacing:1px;color:#c4f46c;background:#2c3520;border-radius:5px;padding:5px 7px}.pad{width:100%;margin:20px 0 8px;font-size:17px;padding:18px;background:#2d3330}.playing .pad{background:#bfe977;color:#142109}.mini{font-size:12px;padding:7px 10px}.progress{height:4px;background:#343741;border-radius:10px;margin:13px 0}.progress div{height:100%;background:#c4f46c;width:0}.empty{text-align:center;padding:70px 20px;border:1px dashed #3b3e48;border-radius:16px}.empty b{font-size:24px}.hint{font-size:12px;color:#9599a6}.loop{color:#c4f46c;border-color:#96bc58}dialog{background:#1e2028;color:#f4f4f7;border:1px solid #454854;border-radius:16px;width:460px;max-width:92vw;padding:26px}dialog::backdrop{background:#000a}dialog h2{font-size:23px;margin-bottom:20px}#status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#343b2b;border:1px solid #74884f;padding:14px 22px;border-radius:12px;max-width:90vw;z-index:5}#status:empty{display:none}.loading{color:#c4f46c}a{color:#c4f46c}@media(max-width:760px){header{padding:0 18px}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #292b34}.main{padding:22px}.songs{max-height:200px;overflow:auto}h1{font-size:29px}.badge{display:none}}

<body>
<header><div class="brand">PALCO<span> ●</span></div><div class="row"><span class="badge">LOCAL · SEM CONTA</span><button id="export">Exportar backup</button><button id="import">Importar</button></div></header>
<div class="layout"><aside><div class="row between"><h2>Seu repertório</h2><span id="count" class="hint">0 músicas</span></div><button class="primary" id="newSong">＋ Nova música</button><input id="search" placeholder="Buscar música…" aria-label="Buscar música"><nav class="songs" id="songs"></nav><p class="footnote">Seus arquivos ficam neste navegador e dispositivo. Exporte backups: apagar os dados do site também apaga a biblioteca.</p></aside><main class="main" id="main"><p class="loading">Abrindo sua biblioteca…</p></main></div>
<dialog id="editor"><form id="form"><h2 id="dialogTitle"></h2><label>Nome<input id="name" required maxlength="100" autocomplete="off"></label><div id="sampleFields"><label>Arquivo de áudio ou MIDI<input id="file" type="file" accept="audio/*,.mid,.midi,.wav,.mp3,.ogg,.flac,.m4a,.aac,.aiff"></label><label>Atalho de teclado (uma letra ou número)<input id="shortcut" maxlength="1" pattern="[A-Za-z0-9]" autocomplete="off"></label><p class="hint">MIDI usa um sintetizador básico. A compatibilidade dos demais formatos depende do navegador.</p></div><div class="row" style="justify-content:flex-end;margin-top:22px"><button type="button" id="cancel">Cancelar</button><button class="primary" id="save" type="submit">Salvar</button></div></form></dialog>
<input id="backup" type="file" accept="application/json,.json" hidden><div id="status" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,songs=[],samples=[],selected=null,editing=null,master=.8,context,statusTimer;const players=new Map(),pending=new Set();let generation=0;
function notify(s){$('#status').textContent=s;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#status').textContent='',6000)}
function tx(stores,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(stores,mode);let result;try{result=fn(t)}catch(e){t.abort();reject(e);return}t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('Operação cancelada'))})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getFile(id){return new Promise((resolve,reject)=>{const r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function refresh(){[songs,samples]=await Promise.all([all('songs'),all('samples')]);if(!songs.some(s=>s.id===selected))selected=songs[0]?.id||null;render()}
function render(){const q=$('#search').value.toLowerCase();$('#count').textContent=songs.length+' músicas';$('#songs').innerHTML=songs.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<button class="song ${s.id===selected?'active':''}" data-song="${s.id}">${esc(s.name)}<small>${samples.filter(x=>x.songId===s.id).length} samples</small></button>`).join('');const song=songs.find(s=>s.id===selected);if(!song){$('#main').innerHTML='<div class="empty"><b>Seu próximo som começa aqui.</b><p>Crie uma música e organize seus samples em um só lugar.</p><button class="primary" data-action="newSong">＋ Criar primeira música</button></div>';return}const list=samples.filter(s=>s.songId===selected).sort((a,b)=>a.position-b.position);$('#main').innerHTML=`<div class="eyebrow">SESSÃO DE PERFORMANCE</div><div class="row between"><div><h1>${esc(song.name)}</h1><p>${list.length} samples · Seu repertório, pronto para tocar.</p></div><div class="row"><button data-action="renameSong">Renomear</button><button class="danger" data-action="deleteSong">Excluir música</button></div></div><div class="toolbar row between"><div class="row"><button class="primary" data-action="add">＋ Adicionar sample</button><button data-action="stopAll">■ Parar tudo <small>· Esc</small></button></div><label class="master">Volume geral <input id="master" aria-label="Volume geral" type="range" min="0" max="1" step=".01" value="${master}"></label></div><div class="grid">${list.map(s=>`<article class="card" data-card="${s.id}"><div class="row between"><span class="type">${s.kind==='midi'?'MIDI':'ÁUDIO'}</span><span class="hint">${s.shortcut?'TECLA '+esc(s.shortcut.toUpperCase()):'SEM ATALHO'}</span></div><h3>${esc(s.name)}</h3><div class="filename" title="${esc(s.fileName)}">${esc(s.fileName)}</div><button class="pad" data-play="${s.id}">▶ Reproduzir</button><div class="row between"><button class="mini" data-stop="${s.id}">■ Parar</button><button class="mini ${s.loop?'loop':''}" aria-pressed="${s.loop}" data-loop="${s.id}">↻ Repetir</button><span class="hint" data-time="${s.id}">0:00</span></div><div class="progress"><div data-progress="${s.id}"></div></div><label>Volume <input type="range" aria-label="Volume de ${esc(s.name)}" data-volume="${s.id}" min="0" max="1" step=".01" value="${s.volume}"></label><div class="row between"><button class="mini" data-edit="${s.id}">Editar</button><button class="mini danger" data-delete="${s.id}">Excluir</button></div></article>`).join('')}</div>${list.length?'':'<div class="empty"><b>Um palco vazio. Infinitas possibilidades.</b><p>Adicione seu primeiro arquivo de áudio ou MIDI.</p></div>'}`;updateUI()}
function openEditor(type,id){editing={type,id};$('#form').reset();$('#sampleFields').hidden=type==='song';const item=(type==='song'?songs:samples).find(s=>s.id===id);$('#dialogTitle').textContent=(id?'Editar ':'Criar ')+(type==='song'?'música':'sample');$('#name').value=item?.name||'';$('#shortcut').value=item?.shortcut||'';$('#file').required=type==='sample'&&!id;$('#editor').showModal();$('#name').focus()}
$('#cancel').onclick=()=>$('#editor').close();$('#newSong').onclick=()=>openEditor('song');$('#search').oninput=render;
$('#file').onchange=()=>{if(!$('#name').value)$('#name').value=$('#file').files[0]?.name.replace(/\.[^.]+$/,'')||''};
$('#form').onsubmit=async e=>{e.preventDefault();const name=$('#name').value.trim();if(!name)return;$('#save').disabled=true;try{if(editing.type==='song'){const old=songs.find(s=>s.id===editing.id);const s={...old,id:old?.id||uid(),name,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};await tx(['songs'],'readwrite',t=>t.objectStore('songs').put(s));selected=s.id}else{const old=samples.find(s=>s.id===editing.id),file=$('#file').files[0],shortcut=$('#shortcut').value.toLowerCase();if(shortcut&&samples.some(s=>s.songId===selected&&s.id!==old?.id&&s.shortcut===shortcut))throw Error('Esse atalho já está em uso nesta música.');const s={...old,id:old?.id||uid(),songId:selected,name,shortcut,volume:old?.volume??.8,loop:old?.loop??false,position:old?.position??Date.now(),fileId:file?uid():old?.fileId,fileName:file?.name||old?.fileName,kind:file?(/\.midi?$/i.test(file.name)?'midi':'audio'):old.kind};if(file&&s.kind==='midi')parseMidi(await file.arrayBuffer());await tx(['samples','files'],'readwrite',t=>{t.objectStore('samples').put(s);if(file){t.objectStore('files').put({id:s.fileId,name:file.name,mime:file.type,size:file.size,blob:file});if(old)t.objectStore('files').delete(old.fileId)}});if(old)stop(old.id)}$('#editor').close();await refresh();notify('Salvo neste navegador.')}catch(e){notify('Não foi possível salvar: '+e.message)}finally{$('#save').disabled=false}};
$('#songs').onclick=e=>{const b=e.target.closest('[data-song]');if(b){stopAll();selected=b.dataset.song;render()}};
$('#main').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{const d=b.dataset;if(d.play)return toggle(d.play);if(d.stop)return stop(d.stop);if(d.edit)return openEditor('sample',d.edit);if(d.loop){const s=samples.find(x=>x.id===d.loop),next={...s,loop:!s.loop};await tx(['samples'],'readwrite',t=>t.objectStore('samples').put(next));Object.assign(s,next);const p=players.get(s.id);if(p?.audio)p.audio.loop=s.loop;render();return}if(d.delete){const s=samples.find(x=>x.id===d.delete);if(!confirm('Excluir o sample “'+s.name+'” e seu arquivo?'))return;await tx(['samples','files'],'readwrite',t=>{t.objectStore('samples').delete(s.id);t.objectStore('files').delete(s.fileId)});stop(s.id);await refresh();return}switch(d.action){case 'newSong':openEditor('song');break;case 'add':openEditor('sample');break;case 'renameSong':openEditor('song',selected);break;case 'stopAll':stopAll();break;case 'deleteSong':if(confirm('Excluir esta música e todos os seus samples?')){await tx(['songs','samples','files'],'readwrite',t=>{t.objectStore('songs').delete(selected);for(const s of samples.filter(s=>s.songId===selected)){t.objectStore('samples').delete(s.id);t.objectStore('files').delete(s.fileId)}});stopAll();await refresh()}}}catch(e){notify(e.message)}};
$('#main').oninput=e=>{if(e.target.id==='master')master=+e.target.value;else if(e.target.dataset.volume){const s=samples.find(s=>s.id===e.target.dataset.volume);s.volume=+e.target.value}applyVolumes()};
$('#main').onchange=async e=>{if(e.target.dataset.volume){try{const s=samples.find(s=>s.id===e.target.dataset.volume);await tx(['samples'],'readwrite',t=>t.objectStore('samples').put(s))}catch(e){notify('Falha ao salvar volume: '+e.message)}}};
function applyVolumes(){for(const [id,p]of players){const v=(samples.find(s=>s.id===id)?.volume||0)*master;if(p.audio)p.audio.volume=v;else p.gain.gain.value=v*.16}}
function killVoices(p){for(const o of p.voices||[]){try{o.stop();o.disconnect()}catch{}}p.voices=[]}
function stop(id){const p=players.get(id);if(p){if(p.audio){p.audio.pause();p.audio.src='';URL.revokeObjectURL(p.url)}else{clearInterval(p.timer);killVoices(p);p.gain.disconnect()}players.delete(id)}pending.delete(id);updateUI()}
function stopAll(){generation++;pending.clear();for(const id of [...players.keys()])stop(id)}
async function toggle(id){try{const existing=players.get(id);if(existing){if(existing.audio){if(existing.audio.paused)await existing.audio.play();else existing.audio.pause()}else{if(existing.playing){existing.offset=position(existing);existing.playing=false;killVoices(existing)}else{await context.resume();existing.base=context.currentTime-existing.offset;existing.index=existing.notes.findIndex(n=>n.start+n.duration>existing.offset);if(existing.index<0)existing.index=existing.notes.length;existing.playing=true}}updateUI();return}if(pending.has(id))return;pending.add(id);const epoch=generation;const s=samples.find(s=>s.id===id);context??=new AudioContext();await context.resume();const f=await getFile(s.fileId);if(epoch!==generation||!pending.has(id))return;if(!f)throw Error('Arquivo não encontrado.');if(s.kind==='audio'){const url=URL.createObjectURL(f.blob),audio=new Audio(url);const p={audio,url};players.set(id,p);audio.volume=s.volume*master;audio.loop=s.loop;audio.onended=()=>stop(id);audio.onerror=()=>{stop(id);notify('O navegador não consegue reproduzir este arquivo. Experimente WAV ou MP3.')};await audio.play()}else{const midi=parseMidi(await f.blob.arrayBuffer());if(epoch!==generation||!pending.has(id))return;const gain=context.createGain();gain.connect(context.destination);const p={...midi,gain,voices:[],index:0,offset:0,base:context.currentTime,playing:true};players.set(id,p);p.timer=setInterval(()=>schedule(id,p),30);applyVolumes();schedule(id,p)}pending.delete(id);updateUI()}catch(e){stop(id);notify('Não foi possível reproduzir: '+e.message)}}
function position(p){return p.audio?p.audio.currentTime:p.playing?context.currentTime-p.base:p.offset}
function schedule(id,p){if(!p.playing)return;let now=position(p);if(now>=p.duration){if(samples.find(s=>s.id===id)?.loop){killVoices(p);p.base=context.currentTime;p.index=0;now=0}else{stop(id);return}}while(p.index<p.notes.length&&p.notes[p.index].start<now+.12){const n=p.notes[p.index++];if(n.start+n.duration<=now)continue;const osc=context.createOscillator(),env=context.createGain(),start=Math.max(context.currentTime,p.base+n.start),end=p.base+n.start+n.duration;osc.type=n.channel===9?'triangle':'sine';osc.frequency.value=440*2**((n.pitch-69)/12);env.gain.setValueAtTime(0,start);env.gain.linearRampToValueAtTime(n.velocity/127,Math.min(start+.008,end));env.gain.linearRampToValueAtTime(0,end+.03);osc.connect(env);env.connect(p.gain);osc.start(start);osc.stop(end+.04);p.voices.push(osc);osc.onended=()=>{osc.disconnect();env.disconnect();p.voices=p.voices.filter(v=>v!==osc)}}}
function parseMidi(buffer){const a=new Uint8Array(buffer),v=new DataView(buffer);let i=0;const need=n=>{if(i+n>a.length)throw Error('MIDI incompleto.')},u8=()=>{need(1);return a[i++]},u16=()=>{need(2);const n=v.getUint16(i);i+=2;return n},u32=()=>{need(4);const n=v.getUint32(i);i+=4;return n},str=n=>{need(n);return String.fromCharCode(...a.slice(i,i+=n))},vlq=()=>{let n=0;for(let j=0;j<4;j++){const b=u8();n=(n<<7)|(b&127);if(!(b&128))return n}throw Error('MIDI: delta inválido.')};if(str(4)!=='MThd')throw Error('Arquivo MIDI inválido.');const len=u32();if(len<6)throw Error('Cabeçalho MIDI inválido.');const format=u16(),tracks=u16(),division=u16();if(format>1||!division||(division&32768))throw Error('Use MIDI formato 0 ou 1 com tempo PPQ.');i+=len-6;const events=[];let maxTick=0;for(let t=0;t<tracks;t++){if(str(4)!=='MTrk')throw Error('Trilha MIDI inválida.');const length=u32(),end=i+length;if(end>a.length)throw Error('Trilha MIDI incompleta.');let tick=0,running=0;while(i<end){tick+=vlq();maxTick=Math.max(maxTick,tick);let status=u8();if(status<128){i--;status=running;if(!status)throw Error('Status MIDI inválido.')}else if(status<240)running=status;if(status===255){running=0;const type=u8(),l=vlq();need(l);if(type===81&&l===3)events.push({tick,tempo:(a[i]<<16)|(a[i+1]<<8)|a[i+2]});i+=l}else if(status===240||status===247){running=0;const l=vlq();need(l);i+=l}else if(status>=240)throw Error('Evento MIDI não suportado.');else{const op=status>>4,ch=status&15,n=u8(),velocity=(op===12||op===13)?0:u8();if(op===8||op===9)events.push({tick,ch,pitch:n,velocity,on:op===9&&velocity>0})}if(i>end)throw Error('Evento fora da trilha MIDI.')}}events.sort((a,b)=>a.tick-b.tick);let tick=0,time=0,tempo=500000;const active=new Map(),notes=[];for(const e of events){time+=(e.tick-tick)*tempo/division/1e6;tick=e.tick;if(e.tempo!==undefined){tempo=e.tempo;continue}const key=e.ch+':'+e.pitch;if(e.on){if(!active.has(key))active.set(key,[]);active.get(key).push({start:time,pitch:e.pitch,velocity:e.velocity,channel:e.ch})}else{const note=active.get(key)?.shift();if(note)notes.push({...note,duration:Math.max(.02,time-note.start)})}}time+=(maxTick-tick)*tempo/division/1e6;for(const queue of active.values())for(const n of queue)notes.push({...n,duration:Math.max(.1,time-n.start)});if(!notes.length)throw Error('Este MIDI não contém notas reproduzíveis.');notes.sort((a,b)=>a.start-b.start);return{notes,duration:Math.max(time,...notes.map(n=>n.start+n.duration))+.1}}
const clock=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function updateUI(){for(const card of document.querySelectorAll('[data-card]')){const p=players.get(card.dataset.card),playing=p&&(p.audio?!p.audio.paused:p.playing),pos=p?position(p):0,dur=p?(p.audio?p.audio.duration:p.duration):0;card.classList.toggle('playing',!!playing);card.querySelector('[data-play]').textContent=playing?'Ⅱ Pausar':pos>0?'▶ Continuar':'▶ Reproduzir';card.querySelector('[data-time]').textContent=clock(pos)+(Number.isFinite(dur)&&dur?' / '+clock(dur):'');card.querySelector('[data-progress]').style.width=(dur?Math.min(100,pos/dur*100):0)+'%'}}setInterval(updateUI,150);
document.addEventListener('keydown',e=>{if($('#editor').open||e.target.closest('input,textarea,select,[contenteditable]')||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'){stopAll();return}const s=samples.find(s=>s.songId===selected&&s.shortcut===e.key.toLowerCase());if(s){e.preventDefault();toggle(s.id)}});
function base64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
$('#export').onclick=async()=>{try{$('#export').disabled=true;const files=await all('files');const backup={version:1,songs:await all('songs'),samples:await all('samples'),files:await Promise.all(files.map(async f=>({...f,blob:undefined,data:await base64(f.blob)})))};const url=URL.createObjectURL(new Blob([JSON.stringify(backup)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='palco-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('Backup exportado.')}catch(e){notify('Erro ao exportar: '+e.message)}finally{$('#export').disabled=false}};
$('#import').onclick=()=>$('#backup').click();$('#backup').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const b=JSON.parse(await file.text());if(b.version!==1||!['songs','samples','files'].every(k=>Array.isArray(b[k])))throw Error('Formato de backup inválido.');const songMap=new Map(),fileMap=new Map();for(const s of b.songs){if(typeof s.id!=='string'||songMap.has(s.id)||typeof s.name!=='string'||!s.name.trim())throw Error('Músicas inválidas.');songMap.set(s.id,uid())}const fs=b.files.map(f=>{if(typeof f.id!=='string'||fileMap.has(f.id)||typeof f.data!=='string'||typeof f.name!=='string')throw Error('Arquivos inválidos.');fileMap.set(f.id,uid());const bytes=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));return{id:fileMap.get(f.id),name:f.name,mime:typeof f.mime==='string'?f.mime:'',size:bytes.length,blob:new Blob([bytes],{type:typeof f.mime==='string'?f.mime:''})}});const seen=new Set(),keys=new Set();const ss=b.samples.map(s=>{const k=s.songId+':'+s.shortcut;if(typeof s.id!=='string'||seen.has(s.id)||typeof s.name!=='string'||!s.name.trim()||typeof s.fileName!=='string'||!songMap.has(s.songId)||!fileMap.has(s.fileId)||!['audio','midi'].includes(s.kind)||!Number.isFinite(s.volume)||s.volume<0||s.volume>1||typeof s.loop!=='boolean'||typeof s.shortcut!=='string'||!/^([a-z0-9])?$/.test(s.shortcut)||(s.shortcut&&keys.has(k)))throw Error('Samples inválidos.');seen.add(s.id);keys.add(k);return{id:uid(),songId:songMap.get(s.songId),fileId:fileMap.get(s.fileId),name:s.name,fileName:s.fileName,kind:s.kind,volume:s.volume,loop:s.loop,shortcut:s.shortcut,position:Number.isFinite(s.position)?s.position:Date.now()}});if(!confirm('Adicionar '+b.songs.length+' músicas do backup? Sua biblioteca atual será mantida.'))return;await tx(['songs','samples','files'],'readwrite',t=>{for(const s of b.songs)t.objectStore('songs').put({id:songMap.get(s.id),name:s.name,createdAt:Date.now(),updatedAt:Date.now()});for(const s of ss)t.objectStore('samples').put(s);for(const f of fs)t.objectStore('files').put(f)});await refresh();notify('Backup importado.')}catch(e){notify('Não foi possível importar: '+e.message)}finally{e.target.value=''}};
async function boot(){try{db=await new Promise((resolve,reject)=>{const r=indexedDB.open('palco-controller',1);r.onupgradeneeded=()=>{for(const n of ['songs','samples','files'])r.result.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>notify('Feche outras abas do Palco para abrir o armazenamento.')});await refresh()}catch(e){$('#main').innerHTML='<div class="empty"><b>Não foi possível abrir o armazenamento.</b><p>Use um navegador com IndexedDB habilitado e permita os dados deste site.</p></div>';notify(e.message)}}boot();
</script>
</body>
